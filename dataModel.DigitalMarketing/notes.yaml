notesPrevious: |
  Data models for digital marketing analytics in a federated data space. They
  describe who legally owns a digital asset (`Organization`), under which
  commercial identity it is operated (`Brand`), which concrete asset is
  measured (`DigitalAsset`), which tool measures it (`SoftwareApplication`),
  which pipeline supplies the data (`DataProvider`) and what the resulting
  observation looks like (`DigitalAssetMetric`). Two more entities describe
  paid-media campaigns: the advertising account (`DigitalPerformanceAsset`)
  and the observation of each campaign (`DigitalPerformanceAssetMetric`).

  Reused entities. `Organization` comes from
  [dataModel.Organization](https://github.com/smart-data-models/dataModel.Organization)
  and is the legal entity that owns a `Brand` or a `DataProvider`.
  `SoftwareApplication` follows [schema.org](https://schema.org/SoftwareApplication)
  and is the tool that measures an asset (Google Analytics 4, Google Ads,
  Meta Ads, LinkedIn...).

  ```
                               Organization (Google LLC)
                                      ↑ refManufacturer
                         SoftwareApplication (GA4)
                                      ↑ refSoftwareApplication
  Organization (Acme Holdings S.L.) ← refOrganization ─ Brand (Acme) ← refBrand ─ DigitalAsset (Acme-GA4)
                 ↑ refOrganization                                                    ↑ refDigitalAsset
         DataProvider (Acme-Internal-Pipeline) ← refDataProvider ─────────── DigitalAssetMetric (dateObserved, P1D, metrics)

  Brand (Acme) ← refBrand ─ DigitalPerformanceAsset (Acme-GoogleAds) ─ refSoftwareApplication → SoftwareApplication (GoogleAds)
                                      ↑ refDigitalPerformanceAsset
          DigitalPerformanceAssetMetric (one per campaign, one observation per day) ─ refDataProvider → DataProvider
  ```

  The models come from two use cases in production on the ARIADNE Data Space
  (https://ariadnedata.eu), and can be reused in any NGSI-LD data space:

  - **Digital Benchmark** (promoter: I2C Internet SL). Cross-brand
    benchmarking of digital marketing performance. Brands publish
    `DigitalAssetMetric` series of their web sites, apps, social profiles and
    paid-ads accounts, and consumers subscribe to comparative analytics under
    explicit ODRL agreements.
  - **ESFERION** (promoter: LIN3S B2B). Investment optimisation of paid-media
    campaigns. Companies publish the daily cumulative performance of each of
    their Google Ads, Meta Ads and LinkedIn Ads campaigns as
    `DigitalPerformanceAssetMetric` entities, attached to one
    `DigitalPerformanceAsset` per advertising account.

  | | `DigitalAssetMetric` | `DigitalPerformanceAssetMetric` |
  | --- | --- | --- |
  | Grain | the asset | each campaign of the advertising account |
  | Value semantics | value of the period (`P1D`, `P1M`, `P3M`, `P1Y`) | cumulative total of the campaign up to `dateObserved` |
  | Typical use | cross-brand benchmarking | campaign investment optimisation and forecasting |

notesEnd: |
  Sovereignty principle. `DataProvider` is decoupled from `Organization` so
  that data lineage is explicit. In the canonical case the pipeline belongs to
  the same `Organization` that owns the brand (`providerKind` = `Internal`),
  even when its operation is delegated to a third party (`refOperator`). A
  third party that publishes its own processing of the same sources does so
  under its own `DataProvider` (`providerKind` = `External`), and consumers
  compare both feeds by filtering on `refDataProvider`.

  Non-additivity by design. `temporalResolution` keeps daily, monthly,
  quarterly and yearly observations in separate entities, because unique-user
  counts and similar metrics cannot be added up across periods.

  Standards used: NGSI-LD (ETSI GS CIM 009), JSON Schema 2020-12, ISO 8601
  durations for `temporalResolution`, ISO 4217 for monetary `unitCode`
  (`EUR` by default), UN/CEFACT common codes for the other units (`C26` =
  minute) and NACE Rev. 2.1 for `Brand.businessSection`.
